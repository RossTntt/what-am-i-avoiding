<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拖延觉察选项脑图</title>
  <style>
    :root{
      --bg-1:#f6f4ee;
      --bg-2:#e9f1ee;
      --ink:#263238;
      --muted:#60706d;
      --line:#b8cfc5;
      --green:#6d8f7d;
      --green-dark:#466a5d;
      --sage:#dfe9e2;
      --blue:#dfeaf0;
      --beige:#fffaf1;
      --card:#fffdf8;
      --card-2:#fbf7ed;
      --shadow:0 18px 45px rgba(64,84,76,.12);
      --shadow-soft:0 8px 22px rgba(64,84,76,.10);
      --radius:24px;
      --focus:#3d7b6f;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(198,220,215,.68), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(226,236,242,.82), transparent 32%),
        linear-gradient(135deg,var(--bg-1),var(--bg-2));
      line-height:1.65;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      inset:auto;
      pointer-events:none;
      width:280px;
      height:280px;
      border-radius:50%;
      filter:blur(22px);
      opacity:.55;
      z-index:-1;
    }

    body::before{
      left:-70px;
      bottom:8%;
      background:rgba(204,225,218,.7);
    }

    body::after{
      right:-90px;
      bottom:18%;
      background:rgba(236,226,201,.75);
    }

    .page{
      width:min(1320px, calc(100% - 32px));
      margin:0 auto;
      padding:40px 0 64px;
    }

    header.hero{
      position:relative;
      padding:34px clamp(20px,4vw,50px);
      border:1px solid rgba(109,143,125,.24);
      border-radius:32px;
      background:
        linear-gradient(135deg,rgba(255,253,248,.92),rgba(246,249,246,.76)),
        radial-gradient(circle at 92% 20%,rgba(196,218,211,.36),transparent 34%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    header.hero::before{
      content:"";
      position:absolute;
      left:-50px;
      top:-60px;
      width:190px;
      height:190px;
      border-radius:50%;
      background:rgba(218,231,225,.7);
    }

    header.hero::after{
      content:"";
      position:absolute;
      right:34px;
      bottom:20px;
      width:140px;
      height:88px;
      opacity:.42;
      background:
        radial-gradient(ellipse at 10% 60%, transparent 54%, rgba(109,143,125,.52) 55%, rgba(109,143,125,.52) 58%, transparent 59%),
        radial-gradient(ellipse at 35% 55%, transparent 54%, rgba(109,143,125,.48) 55%, rgba(109,143,125,.48) 58%, transparent 59%),
        radial-gradient(ellipse at 60% 50%, transparent 54%, rgba(109,143,125,.44) 55%, rgba(109,143,125,.44) 58%, transparent 59%);
      transform:rotate(-8deg);
    }

    .eyebrow{
      position:relative;
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:6px 12px;
      border-radius:999px;
      color:var(--green-dark);
      background:rgba(223,233,226,.76);
      font-size:14px;
      letter-spacing:.08em;
      font-weight:700;
    }

    .eyebrow::before{
      content:"";
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 0 5px rgba(109,143,125,.14);
    }

    h1{
      position:relative;
      margin:16px 0 12px;
      max-width:900px;
      color:#23423a;
      font-size:clamp(34px,5vw,68px);
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .hero p{
      position:relative;
      max-width:880px;
      margin:0;
      color:var(--muted);
      font-size:clamp(16px,1.7vw,20px);
    }

    .toolbar{
      display:grid;
      grid-template-columns:1.25fr auto auto auto;
      gap:12px;
      margin:22px 0 14px;
      align-items:center;
    }

    .searchbox{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:48px;
      padding:0 16px;
      border:1px solid rgba(109,143,125,.28);
      border-radius:999px;
      background:rgba(255,253,248,.84);
      box-shadow:var(--shadow-soft);
    }

    .searchbox svg{flex:0 0 auto;color:var(--green-dark)}

    input[type="search"]{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
      font:inherit;
    }

    input[type="search"]::placeholder{color:#8a9692}

    .btn{
      appearance:none;
      border:1px solid rgba(109,143,125,.32);
      border-radius:999px;
      padding:12px 16px;
      min-height:48px;
      color:var(--green-dark);
      background:rgba(255,253,248,.92);
      box-shadow:var(--shadow-soft);
      font:inherit;
      font-weight:700;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      white-space:nowrap;
    }

    .btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(64,84,76,.13);background:#fff}
    .btn:focus-visible{outline:3px solid rgba(61,123,111,.28);outline-offset:3px}

    .quick-panel{
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);
      gap:16px;
      margin:18px 0 26px;
      align-items:stretch;
    }

    .formula,
    .guide{
      border:1px solid rgba(109,143,125,.24);
      border-radius:var(--radius);
      background:rgba(255,253,248,.78);
      box-shadow:var(--shadow-soft);
      padding:18px 20px;
      backdrop-filter:blur(12px);
    }

    .formula-title,
    .guide-title{
      margin:0 0 10px;
      color:var(--green-dark);
      font-size:16px;
      font-weight:800;
    }

    .formula-line{
      margin:0;
      font-size:clamp(17px,2vw,22px);
      color:#2a403b;
      font-weight:700;
    }

    .slot{
      display:inline-flex;
      min-width:120px;
      max-width:100%;
      padding:2px 10px;
      margin:0 2px;
      border-radius:999px;
      color:#31594f;
      background:rgba(223,233,226,.86);
      word-break:break-word;
      vertical-align:baseline;
    }

    .guide p{margin:0;color:var(--muted)}

    .mindmap-wrap{
      position:relative;
      padding:18px 0 0;
    }

    .connector-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      overflow:visible;
      z-index:0;
    }

    .connector-svg path{
      fill:none;
      stroke:rgba(109,143,125,.38);
      stroke-width:2;
      stroke-linecap:round;
      stroke-dasharray:5 8;
    }

    .center-node{
      position:relative;
      z-index:2;
      width:min(560px, 100%);
      margin:0 auto 26px;
      padding:22px 28px;
      border-radius:999px;
      text-align:center;
      color:#24443c;
      background:
        linear-gradient(135deg,rgba(255,253,248,.96),rgba(223,233,226,.92));
      border:1px solid rgba(109,143,125,.32);
      box-shadow:var(--shadow);
    }

    .center-node strong{
      display:block;
      font-size:clamp(22px,3vw,36px);
      line-height:1.2;
    }

    .center-node span{
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:15px;
    }

    .map-grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:18px;
      align-items:start;
    }

    .category-card{
      position:relative;
      border:1px solid rgba(109,143,125,.22);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,253,248,.96),rgba(251,247,237,.90));
      box-shadow:var(--shadow-soft);
      overflow:hidden;
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, opacity .22s ease;
    }

    .category-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:6px;
      background:linear-gradient(90deg, var(--tone), rgba(255,255,255,0));
    }

    .category-card:hover{
      transform:translateY(-3px);
      box-shadow:0 16px 38px rgba(64,84,76,.14);
      border-color:rgba(109,143,125,.38);
    }

    .category-card.is-hidden{display:none}

    .category-head{
      width:100%;
      appearance:none;
      border:0;
      background:transparent;
      text-align:left;
      padding:22px 20px 16px;
      cursor:pointer;
      color:inherit;
      font:inherit;
    }

    .category-head:focus-visible{outline:3px solid rgba(61,123,111,.28);outline-offset:-7px;border-radius:24px}

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .icon{
      display:grid;
      place-items:center;
      width:44px;
      height:44px;
      flex:0 0 auto;
      border-radius:16px;
      background:rgba(223,233,226,.72);
      color:#335e53;
      font-size:23px;
    }

    .title-wrap{min-width:0;flex:1}

    h2{
      margin:0;
      color:#25453d;
      font-size:19px;
      line-height:1.3;
      letter-spacing:-.01em;
    }

    .desc{
      margin:7px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .toggle{
      display:grid;
      place-items:center;
      width:34px;
      height:34px;
      border-radius:50%;
      color:var(--green-dark);
      background:rgba(223,233,226,.74);
      font-weight:900;
      transition:transform .2s ease;
      flex:0 0 auto;
    }

    .category-card.is-open .toggle{transform:rotate(45deg)}

    .typical{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:14px 0 0;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      max-width:100%;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(234,242,238,.88);
      color:#31574e;
      font-size:13px;
      line-height:1.3;
    }

    .chip::before{
      content:"";
      width:6px;
      height:6px;
      flex:0 0 auto;
      border-radius:50%;
      background:var(--tone);
    }

    .full{
      display:grid;
      grid-template-rows:0fr;
      transition:grid-template-rows .28s ease;
      border-top:1px solid rgba(109,143,125,.16);
      background:rgba(255,253,248,.62);
    }

    .category-card.is-open .full{grid-template-rows:1fr}

    .full-inner{
      overflow:hidden;
    }

    .full-content{
      padding:16px 20px 20px;
    }

    .section-label{
      margin:0 0 10px;
      color:#466a5d;
      font-size:14px;
      font-weight:900;
      letter-spacing:.04em;
    }

    .options{
      display:grid;
      gap:8px;
      margin:0 0 16px;
      padding:0;
      list-style:none;
    }

    .option-btn{
      width:100%;
      appearance:none;
      border:1px solid rgba(109,143,125,.18);
      border-radius:14px;
      padding:9px 10px;
      text-align:left;
      color:#344642;
      background:rgba(255,253,248,.78);
      font:inherit;
      font-size:14px;
      line-height:1.45;
      cursor:pointer;
      transition:background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .option-btn:hover{
      transform:translateX(2px);
      border-color:rgba(109,143,125,.38);
      background:#fff;
    }

    .option-btn.is-selected{
      border-color:rgba(61,123,111,.62);
      background:rgba(223,233,226,.86);
      color:#24483f;
      font-weight:700;
    }

    .option-btn:focus-visible{outline:3px solid rgba(61,123,111,.25);outline-offset:2px}

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .action-pill{
      display:inline-flex;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(109,143,125,.20);
      background:rgba(223,233,226,.62);
      color:#355c52;
      font-size:13px;
      cursor:pointer;
      transition:transform .16s ease, background .16s ease;
    }

    .action-pill:hover{transform:translateY(-1px);background:rgba(223,233,226,.88)}

    .empty-state{
      display:none;
      text-align:center;
      padding:34px 20px;
      margin:20px 0 0;
      border:1px dashed rgba(109,143,125,.36);
      border-radius:24px;
      background:rgba(255,253,248,.65);
      color:var(--muted);
    }

    .empty-state.is-show{display:block}

    .footer-note{
      margin:32px auto 0;
      max-width:880px;
      color:var(--muted);
      text-align:center;
      font-size:14px;
    }

    mark{
      padding:0 .16em;
      border-radius:5px;
      background:rgba(238,224,174,.75);
      color:inherit;
    }

    @media (max-width:1180px){
      .map-grid{grid-template-columns:repeat(3, minmax(0,1fr))}
    }

    @media (max-width:860px){
      .page{width:min(100% - 22px, 1320px);padding-top:18px}
      header.hero{padding:26px 22px;border-radius:26px}
      .toolbar{grid-template-columns:1fr 1fr;gap:10px}
      .searchbox{grid-column:1 / -1}
      .quick-panel{grid-template-columns:1fr}
      .map-grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:14px}
      .center-node{border-radius:28px}
      .connector-svg{display:none}
    }

    @media (max-width:560px){
      .toolbar{grid-template-columns:1fr}
      .btn{width:100%}
      .map-grid{grid-template-columns:1fr}
      h1{font-size:34px}
      .hero p{font-size:15px}
      .category-head{padding:20px 18px 14px}
      .full-content{padding:14px 18px 18px}
      .card-top{gap:10px}
      .icon{width:40px;height:40px;font-size:21px}
    }

    @media print{
      body{background:#fff}
      header.hero,.formula,.guide,.category-card{box-shadow:none}
      .toolbar,.connector-svg,.toggle{display:none!important}
      .map-grid{grid-template-columns:repeat(2, 1fr)}
      .category-card{break-inside:avoid}
      .full{grid-template-rows:1fr!important}
      .full-inner{overflow:visible}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">拖延觉察答案菜单</div>
      <h1>我现在在逃避什么？</h1>
      <p>像脑图一样先看大类，再看小类。每个大类会先露出最典型的三个答案，点开后可以选择更完整的表述，并接上一个很小的行动。</p>
    </header>

    <section class="toolbar" aria-label="操作区">
      <label class="searchbox" aria-label="搜索选项">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.2-4.2m1.2-5.3a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="搜索：比如 害怕、无聊、标准、手机、求助……" autocomplete="off" />
      </label>
      <button class="btn" id="expandAll" type="button">展开全部</button>
      <button class="btn" id="collapseAll" type="button">收起全部</button>
      <button class="btn" id="copyLine" type="button">复制填空句</button>
    </section>

    <section class="quick-panel" aria-label="当前选择">
      <div class="formula">
        <p class="formula-title">当下填空</p>
        <p class="formula-line">我现在可能在逃避：<span class="slot" id="selectedOption">先选一个最像的答案</span>；我接下来只做：<span class="slot" id="selectedAction">一个小动作</span>。</p>
      </div>
      <div class="guide">
        <p class="guide-title">使用方式</p>
        <p>不要追求选得完全准确。选一个最接近的答案，然后立刻接一个两分钟以内的小动作。</p>
      </div>
    </section>

    <section class="mindmap-wrap" id="mindmapWrap" aria-label="拖延觉察脑图">
      <svg class="connector-svg" id="connectorSvg" aria-hidden="true"></svg>
      <div class="center-node" id="centerNode">
        <strong>拖延觉察</strong>
        <span>发现 → 命名 → 回到最小动作</span>
      </div>
      <div class="map-grid" id="mapGrid"></div>
      <div class="empty-state" id="emptyState">没有找到匹配的选项。可以换一个更宽泛的词，比如“怕”“累”“不确定”。</div>
    </section>

    <p class="footer-note">提示：打印时会自动展开完整选项。这个页面适合放在浏览器书签、笔记软件或任务开始前的检查清单里。</p>
  </main>

  <script>
    const categories = [
      {
        title:"任务本身太模糊",
        icon:"☁️",
        tone:"#8fb4ad",
        desc:"脑子里只有一团任务，缺少清晰入口。",
        typical:["不知道第一步是什么","不知道做到什么程度","信息太多，理不清"],
        options:[
          "我不知道第一步是什么。",
          "我不知道做到什么程度才算完成。",
          "我不知道先做哪个部分。",
          "我不知道标准是什么。",
          "我不知道对方真正想要什么。",
          "我不知道这个任务最后要交付成什么样。",
          "我脑子里只有一团混乱的任务，没有清楚的小步骤。",
          "我需要先查资料，但不知道查什么。",
          "我需要先整理信息，但信息太多。",
          "我需要先制定计划，可我连计划也不想做。"
        ],
        actions:["把任务写成一句话","写下一个最小动作","先做一个粗糙版本"]
      },
      {
        title:"任务太大，启动成本太高",
        icon:"⛰️",
        tone:"#b8a985",
        desc:"一想到全部工作量，身体已经想撤退。",
        typical:["任务看起来会花很久","想等完整时间再做","把开始当成必须完成"],
        options:[
          "我一想到全部工作量就想逃。",
          "我觉得这件事会花很久。",
          "我觉得一开始就会被卷进去。",
          "我担心做了五分钟也看不到进展。",
          "我想等有一大段完整时间再做。",
          "我觉得现在开始也做不完。",
          "我把“开始”等同于“必须完成”。",
          "我把“打开任务”等同于“马上进入高强度状态”。"
        ],
        actions:["只打开它","只做两分钟","只写一个标题","做最低可行版本"]
      },
      {
        title:"害怕失败",
        icon:"🌧️",
        tone:"#93a7bd",
        desc:"任务像是在检验能力，越想越紧。",
        typical:["怕自己做不好","怕努力后仍然没用","怕暴露不足"],
        options:[
          "我怕自己做不好。",
          "我怕结果很差。",
          "我怕发现自己能力不够。",
          "我怕努力了也没用。",
          "我怕做出来之后很失望。",
          "我怕暴露自己的不足。",
          "我怕一开始就发现问题比想象中更严重。",
          "我怕已经太晚了。"
        ],
        actions:["先做草稿","允许第一版粗糙","先收集问题"]
      },
      {
        title:"害怕评价",
        icon:"👀",
        tone:"#ad9bbd",
        desc:"担心别人怎么看、怎么说、怎么改。",
        typical:["怕被批评","怕对方失望","怕被比较"],
        options:[
          "我怕别人觉得我不专业。",
          "我怕被批评。",
          "我怕被否定。",
          "我怕对方失望。",
          "我怕别人看到我的进度很慢。",
          "我怕交出去后被要求重做。",
          "我怕别人发现我其实没准备好。",
          "我怕被比较。"
        ],
        actions:["先做给自己看","做内部草稿","准备可修改版本"]
      },
      {
        title:"完美主义",
        icon:"✨",
        tone:"#d4bc73",
        desc:"想等到更清楚、更漂亮、更有把握。",
        typical:["想等想清楚再开始","怕第一版粗糙","一直优化工具资料"],
        options:[
          "我想等想清楚再开始。",
          "我想一开始就做得漂亮。",
          "我怕做出一个很粗糙的东西。",
          "我不想面对“第一版很烂”的感觉。",
          "我总觉得还需要更多准备。",
          "我觉得如果不能做好，就干脆先不做。",
          "我一直在找最佳方法。",
          "我一直在优化工具、环境、资料，却没有真正开始。"
        ],
        actions:["做低质量第一版","先允许它难看","做一个可修改版本"]
      },
      {

    const mapGrid = document.getElementById('mapGrid');
    const emptyState = document.getElementById('emptyState');
    const selectedOption = document.getElementById('selectedOption');
    const selectedAction = document.getElementById('selectedAction');
    const searchInput = document.getElementById('search');
    const connectorSvg = document.getElementById('connectorSvg');
    const mindmapWrap = document.getElementById('mindmapWrap');
    const centerNode = document.getElementById('centerNode');
    let currentOption = '先选一个最像的答案';
    let currentAction = '一个小动作';

    function escapeHtml(text){
      return text.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    }

    function highlight(text, query){
      if(!query) return escapeHtml(text);
      const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(${q})`, 'gi');
      return escapeHtml(text).replace(re, '<mark>$1</mark>');
    }

    function render(query=''){
      const q = query.trim().toLowerCase();
      mapGrid.innerHTML = categories.map((cat, index) => {
        const haystack = [cat.title, cat.desc, ...cat.typical, ...cat.options, ...cat.actions].join(' ').toLowerCase();
        const hidden = q && !haystack.includes(q);
        const typicalHtml = cat.typical.map(item => `<span class="chip">${highlight(item, q)}</span>`).join('');
        const optionsHtml = cat.options.map(opt => `
          <li><button type="button" class="option-btn" data-option="${escapeHtml(opt)}" data-action="${escapeHtml(cat.actions[0])}">${highlight(opt, q)}</button></li>
        `).join('');
        const actionsHtml = cat.actions.map(action => `<button type="button" class="action-pill" data-action="${escapeHtml(action)}">${highlight(action, q)}</button>`).join('');
        return `
          <article class="category-card${hidden ? ' is-hidden' : ''}" data-card="${index}" style="--tone:${cat.tone}">
            <button class="category-head" type="button" aria-expanded="false">
              <div class="card-top">
                <span class="icon" aria-hidden="true">${cat.icon}</span>
                <span class="title-wrap">
                  <h2>${highlight(cat.title, q)}</h2>
                  <span class="desc">${highlight(cat.desc, q)}</span>
                  <span class="typical" aria-label="最典型的三个小类">${typicalHtml}</span>
                </span>
                <span class="toggle" aria-hidden="true">＋</span>
              </div>
            </button>
            <div class="full" aria-hidden="true">
              <div class="full-inner">
                <div class="full-content">
                  <p class="section-label">完整选项</p>
                  <ul class="options">${optionsHtml}</ul>
                  <p class="section-label">可以接上的小动作</p>
                  <div class="actions">${actionsHtml}</div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      if(q){
        document.querySelectorAll('.category-card:not(.is-hidden)').forEach(card => setOpen(card, true));
      }
      bindEvents();
      updateEmptyState();
      requestAnimationFrame(drawConnectors);
    }

    function setOpen(card, open){
      const head = card.querySelector('.category-head');
      const full = card.querySelector('.full');
      card.classList.toggle('is-open', open);
      head.setAttribute('aria-expanded', String(open));
      full.setAttribute('aria-hidden', String(!open));
    }

    function bindEvents(){
      document.querySelectorAll('.category-head').forEach(head => {
        head.addEventListener('click', () => {
          const card = head.closest('.category-card');
          setOpen(card, !card.classList.contains('is-open'));
          setTimeout(drawConnectors, 280);
        });
      });

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('is-selected'));
          btn.classList.add('is-selected');
          currentOption = btn.dataset.option;
          currentAction = btn.dataset.action;
          selectedOption.textContent = currentOption.replace(/。$/, '');
          selectedAction.textContent = currentAction;
        });
      });

      document.querySelectorAll('.action-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentAction = btn.dataset.action;
          selectedAction.textContent = currentAction;
        });
      });
    }

    function updateEmptyState(){
      const visible = document.querySelectorAll('.category-card:not(.is-hidden)').length;
      emptyState.classList.toggle('is-show', visible === 0);
    }

    function drawConnectors(){
      const wrapRect = mindmapWrap.getBoundingClientRect();
      connectorSvg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
      connectorSvg.innerHTML = '';

      const centerRect = centerNode.getBoundingClientRect();
      const startX = centerRect.left - wrapRect.left + centerRect.width / 2;
      const startY = centerRect.bottom - wrapRect.top - 6;

      document.querySelectorAll('.category-card:not(.is-hidden)').forEach(card => {
        const rect = card.getBoundingClientRect();
        const endX = rect.left - wrapRect.left + rect.width / 2;
        const endY = rect.top - wrapRect.top + 8;
        const midY = startY + Math.max(30, (endY - startY) * .45);
        const d = `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`;
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', d);
        connectorSvg.appendChild(path);
      });
    }

    document.getElementById('expandAll').addEventListener('click', () => {
      document.querySelectorAll('.category-card:not(.is-hidden)').forEach(card => setOpen(card, true));
      setTimeout(drawConnectors, 280);
    });

    document.getElementById('collapseAll').addEventListener('click', () => {
      document.querySelectorAll('.category-card').forEach(card => setOpen(card, false));
      setTimeout(drawConnectors, 280);
    });

    document.getElementById('copyLine').addEventListener('click', async () => {
      const line = `我现在可能在逃避：${currentOption.replace(/。$/, '')}；我接下来只做：${currentAction}。`;
      try{
        await navigator.clipboard.writeText(line);
        const btn = document.getElementById('copyLine');
        const old = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = old, 1200);
      }catch(e){
        alert(line);
      }
    });

    searchInput.addEventListener('input', e => render(e.target.value));
    window.addEventListener('resize', () => requestAnimationFrame(drawConnectors));
    window.addEventListener('load', () => requestAnimationFrame(drawConnectors));

    render();
  </script>
